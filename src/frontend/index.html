<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <meta name="description" content="Azure Static Web Apps と Functions のサンプルアプリです。">
    <title>Flyingfish | Azure サンプル</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Noto Sans JP", sans-serif;
        background: #101827;
        color: #edf3fb;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: radial-gradient(ellipse at 18% 12%, #183c52 0, transparent 38%), #101827;
      }
      main { width: min(100%, 760px); }
      .eyebrow { color: #7ee4cc; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 14px 0 12px; font-size: clamp(2.2rem, 7vw, 4.3rem); line-height: 1.05; letter-spacing: -.045em; }
      .intro { max-width: 560px; color: #aebdd0; font-size: 1.05rem; line-height: 1.8; }
      .card {
        margin-top: 36px;
        padding: clamp(22px, 5vw, 34px);
        border: 1px solid #33445a;
        border-radius: 20px;
        background: rgb(24 36 53 / 88%);
        box-shadow: 0 24px 70px rgb(0 0 0 / 22%);
      }
      .card h2 { margin: 0 0 8px; font-size: 1.2rem; }
      .card p { color: #aebdd0; line-height: 1.7; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: #7ee4cc;
        color: #102631;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #a2f2df; }
      button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      #result { min-height: 1.7em; margin-bottom: 0; color: #edf3fb; }
      footer { margin-top: 22px; color: #8292a8; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Azure · Static Web Apps</p>
      <h1>Flyingfish</h1>
      <p class="intro">Bicep で構築した Azure Static Web Apps と、HTTP API 用 Azure Functions のサンプルです。</p>

      <section class="card" aria-labelledby="api-title">
        <h2 id="api-title">Functions API 接続確認</h2>
        <p>ボタンを押すと <code>/api/hello</code> を呼び出します。</p>
        <button id="check-api" type="button">API を呼び出す</button>
        <p id="result" role="status" aria-live="polite">まだ呼び出していません。</p>
      </section>
      <footer>静的ページと API は GitHub Actions からデプロイします。</footer>
    </main>
    <script>
      const button = document.querySelector('#check-api');
      const result = document.querySelector('#result');

      button.addEventListener('click', async () => {
        button.disabled = true;
        result.textContent = '接続中…';
        try {
          const response = await fetch('/api/hello');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const body = await response.json();
          result.textContent = body.message;
        } catch (error) {
          result.textContent = `API に接続できませんでした: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
