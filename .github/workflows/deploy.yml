name: deploy
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: echo test
  deploy:
    runs-on: windows-latest
    needs: build
    # 権限の付与の追加
    permissions:
      contents: read
      id-token: write
    steps:
      # ログイン処理の追加
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: test command
        run: az group list --output table
