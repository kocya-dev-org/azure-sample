name: Deploy Flyingfish

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Use exact commit SHAs for deterministic PR and push change detection.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.ref }}
          # Use git diff so the explicit base SHA is honored for pull requests.
          token: ''
          filters: |
            src:
              - 'src/**'
            infra:
              - 'infra/**'

  validate-infra:
    name: Validate Bicep
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint and build Bicep
        run: |
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep
          az bicep build-params --file infra/environments/dev.bicepparam

  deploy-infrastructure:
    name: Deploy Azure infrastructure
    needs:
      - changes
      - validate-infra
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Existing repository OIDC credentials are used here.
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name flyingfish-dev \
            --parameters infra/environments/dev.bicepparam \
            --output none

          STATIC_WEB_APP_NAME=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name flyingfish-dev \
            --query properties.outputs.staticWebAppName.value \
            --output tsv)
          FUNCTION_APP_NAME=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name flyingfish-dev \
            --query properties.outputs.functionAppName.value \
            --output tsv)
          FUNCTION_APP_ID=$(az functionapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query id \
            --output tsv)
          az staticwebapp backends link \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$STATIC_WEB_APP_NAME" \
            --backend-resource-id "$FUNCTION_APP_ID" \
            --backend-region eastus2

  deploy-functions:
    name: Deploy Azure Functions
    needs:
      - changes
      - validate-infra
      - deploy-infrastructure
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.validate-infra.result != 'failure' &&
      needs.validate-infra.result != 'cancelled' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.src == 'true' && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')) ||
        (github.event_name == 'workflow_dispatch' && needs.deploy-infrastructure.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and deploy Functions
        working-directory: src/api
        run: |
          FUNCTION_APP_NAME=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name flyingfish-dev \
            --query properties.outputs.functionAppName.value \
            --output tsv)
          npm ci
          npm run build
          npm prune --omit=dev
          echo "FUNCTION_APP_NAME=$FUNCTION_APP_NAME" >> "$GITHUB_ENV"

      - name: Publish Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: src/api

  deploy-static-web-app:
    name: Deploy frontend
    needs:
      - changes
      - validate-infra
      - deploy-infrastructure
      - deploy-functions
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.validate-infra.result != 'failure' &&
      needs.validate-infra.result != 'cancelled' &&
      needs.deploy-functions.result != 'failure' &&
      needs.deploy-functions.result != 'cancelled' &&
      (
        (github.event_name == 'pull_request' && github.event.action != 'closed' && needs.changes.outputs.src == 'true') ||
        (github.event_name == 'push' && needs.changes.outputs.src == 'true' && needs.deploy-functions.result == 'success' && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')) ||
        (github.event_name == 'workflow_dispatch' && needs.deploy-infrastructure.result == 'success' && needs.deploy-functions.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: swa-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Static Web Apps deployment token
        id: swa-token
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$SWA_DEPLOYMENT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set AZURE_STATIC_WEB_APPS_API_TOKEN after the Static Web App has been provisioned."
          fi

      - name: Deploy Static Web Apps app and API
        if: steps.swa-token.outputs.configured == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /src/frontend
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: main

  close-static-web-app-preview:
    name: Close Static Web Apps preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Static Web Apps deployment token
        id: swa-token
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$SWA_DEPLOYMENT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set AZURE_STATIC_WEB_APPS_API_TOKEN to close the preview environment."
          fi

      - name: Close preview environment
        if: steps.swa-token.outputs.configured == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
