name: Deploy Flyingfish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.ref }}
          token: ''
          filters: |
            infra:
              - 'infra/**'
            backend:
              - 'src/api/**'
            frontend:
              - 'src/frontend/**'

  validate-infra:
    needs: changes
    if: github.event_name != 'pull_request' && (needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep
          az bicep build-params --file infra/environments/dev.bicepparam

  deploy-infrastructure:
    needs: [changes, validate-infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep and remove legacy private endpoints
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -n flyingfish-dev -f infra/main.bicep -p infra/environments/dev.bicepparam
          for resource in $(az network private-endpoint list -g "$RESOURCE_GROUP" --query "[?starts_with(name, 'pe-cosmos-') || starts_with(name, 'pe-stdata')].id" -o tsv); do
            az resource delete --ids "$resource"
          done

  deploy-backend:
    needs: [changes, validate-infra, deploy-infrastructure]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd src/api
          npm ci
          npm run build
          npm prune --omit=dev
          mkdir -p ../../deploy/api
          cp package.json package-lock.json ../../deploy/api/
          cp -r dist ../../deploy/api/
          cp -r node_modules ../../deploy/api/
          cd ../../deploy
          zip -qr ../backend.zip api
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy backend files
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az webapp deploy -g "$RESOURCE_GROUP" -n sample-azure --src-path backend.zip --type zip

  deploy-frontend:
    needs: [changes, validate-infra, deploy-infrastructure]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Package frontend under its own directory
        run: |
          mkdir -p deploy/frontend
          cp -r src/frontend/. deploy/frontend/
          cd deploy
          zip -qr ../frontend.zip frontend
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy frontend files
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az webapp deploy -g "$RESOURCE_GROUP" -n sample-azure --src-path frontend.zip --type zip
