name: Deploy Flyingfish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (defaults to all)
        type: choice
        required: false
        default: all
        options:
          - all
          - infra
          - app

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.ref }}
          token: ''
          filters: |
            tooling: &tooling
              - 'package.json'
              - 'package-lock.json'
              - '.node-version'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'vitest.config.ts'
              - 'scripts/**'
            infra:
              - 'infra/**'
            backend:
              - 'src/api/**'
              - *tooling
            frontend:
              - 'src/frontend/**'
              - *tooling

  verify:
    needs: changes
    if: >-
      !(github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check build outputs for secrets
        run: npm run check:secrets

  validate-infra:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.infra == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'infra')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep
          az bicep build-params --file infra/environments/dev.bicepparam

  deploy-infrastructure:
    needs: [changes, validate-infra]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.validate-infra.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'infra')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure and configure API settings
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name flyingfish-dev \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.bicepparam \
            --output json)

          static_web_app_name=$(jq -er '.properties.outputs.staticWebAppName.value' <<< "$deployment")
          cosmos_name=$(jq -er '.properties.outputs.cosmosAccountName.value' <<< "$deployment")

          cosmos_connection_string=$(az cosmosdb keys list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$cosmos_name" \
            --type connection-strings \
            --query 'connectionStrings[0].connectionString' \
            --output tsv)

          # Blob Storage は MVP では使わないため、接続文字列は設定しない（ADR 0003）
          az staticwebapp appsettings set \
            --name "$static_web_app_name" \
            --setting-names \
              "COSMOS_CONNECTION_STRING=$cosmos_connection_string" \
              'COSMOS_DATABASE_ID=flyingfish' \
            --output none

  configure-foundry-settings:
    needs: [changes, deploy-infrastructure]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'infra' || inputs.target == 'app')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set Microsoft Foundry API settings
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FOUNDRY_API_KEY: ${{ secrets.AZURE_AI_FOUNDRY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FOUNDRY_API_KEY" ]]; then
            echo "Repository secret AZURE_AI_FOUNDRY_API_KEY is not configured."
            exit 1
          fi
          static_web_app_name=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name flyingfish-dev \
            --query properties.outputs.staticWebAppName.value \
            --output tsv)
          az staticwebapp appsettings set \
            --name "$static_web_app_name" \
            --setting-names \
              "FOUNDRY_API_KEY=$FOUNDRY_API_KEY" \
              'FOUNDRY_ENDPOINT=https://sample-app-foundary.openai.azure.com/openai/v1/' \
              'FOUNDRY_MODEL=gpt-5-mini' \
            --output none

  deploy-static-web-app:
    needs: [changes, verify, validate-infra, deploy-infrastructure, configure-foundry-settings]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.validate-infra.result != 'failure' &&
      needs.validate-infra.result != 'cancelled' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'app')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'))) &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped') &&
      (needs.configure-foundry-settings.result == 'success' || needs.configure-foundry-settings.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build the frontend and API with Node.js 24
        run: |
          npm ci
          npm run build
      - name: Stage the managed Functions API with production dependencies only
        shell: bash
        run: npm run stage:api
      - name: Deploy the prebuilt Static Web App and managed Functions API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend/dist
          api_location: .deploy/api
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close-static-web-app-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Close the Static Web App preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
