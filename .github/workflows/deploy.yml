name: Deploy Flyingfish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (defaults to all)
        type: choice
        required: false
        default: all
        options:
          - all
          - infra
          - app

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.ref }}
          token: ''
          filters: |
            infra:
              - 'infra/**'
            backend:
              - 'src/api/**'
            frontend:
              - 'src/frontend/**'

  validate-infra:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.infra == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'infra')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep
          az bicep build-params --file infra/environments/dev.bicepparam

  deploy-infrastructure:
    needs: [changes, validate-infra]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.validate-infra.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'infra')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure and configure API settings
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name flyingfish-dev \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.bicepparam \
            --output json)

          static_web_app_name=$(jq -er '.properties.outputs.staticWebAppName.value' <<< "$deployment")
          cosmos_name=$(jq -er '.properties.outputs.cosmosAccountName.value' <<< "$deployment")
          storage_name=$(jq -er '.properties.outputs.dataStorageAccountName.value' <<< "$deployment")

          cosmos_connection_string=$(az cosmosdb keys list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$cosmos_name" \
            --type connection-strings \
            --query 'connectionStrings[0].connectionString' \
            --output tsv)
          blob_connection_string=$(az storage account show-connection-string \
            --resource-group "$RESOURCE_GROUP" \
            --name "$storage_name" \
            --query connectionString \
            --output tsv)

          az staticwebapp appsettings set \
            --name "$static_web_app_name" \
            --setting-names \
              "COSMOS_CONNECTION_STRING=$cosmos_connection_string" \
              'COSMOS_DATABASE_ID=flyingfish' \
              'COSMOS_CONTAINER_ID=records' \
              "BLOB_CONNECTION_STRING=$blob_connection_string" \
              'BLOB_CONTAINER_NAME=objects' \
            --output none

  deploy-static-web-app:
    needs: [changes, validate-infra, deploy-infrastructure]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.validate-infra.result != 'failure' &&
      needs.validate-infra.result != 'cancelled' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'app')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'))) &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy the Static Web App and managed Functions API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend
          api_location: src/api
          output_location: ''
          api_build_command: npm run build
