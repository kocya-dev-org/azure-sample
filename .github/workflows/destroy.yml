name: Destroy Flyingfish infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE to remove Flyingfish resources from AZURE_RESOURCE_GROUP
        type: choice
        options:
          - NO
          - DELETE
        default: NO
        required: true

permissions:
  contents: read

jobs:
  destroy-infrastructure:
    name: Delete Flyingfish resources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DESTROY_CONFIRMATION: ${{ inputs.confirm }}
    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          if [[ "$DESTROY_CONFIRMATION" != "DELETE" ]]; then
            echo "Select DELETE to continue. No Azure resources were changed."
            exit 1
          fi
          if [[ -z "$AZURE_RESOURCE_GROUP" ]]; then
            echo "Repository variable AZURE_RESOURCE_GROUP is not configured."
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Flyingfish resources
        shell: bash
        run: |
          set -euo pipefail

          deployment=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name flyingfish-dev \
            --query properties.outputs \
            --output json)
          static_web_app_name=$(jq -er '.staticWebAppName.value' <<< "$deployment")
          cosmos_name=$(jq -er '.cosmosAccountName.value' <<< "$deployment")
          storage_name=$(jq -er '.dataStorageAccountName.value' <<< "$deployment")
          subscription_id=$(az account show --query id --output tsv)

          resource_id() {
            printf '/subscriptions/%s/resourceGroups/%s/providers/%s/%s' \
              "$subscription_id" "$AZURE_RESOURCE_GROUP" "$1" "$2"
          }

          echo "Deleting the Static Web App, Cosmos DB account, and data storage account."
          az resource delete --ids "$(resource_id 'Microsoft.Web/staticSites' "$static_web_app_name")"
          az resource delete --ids "$(resource_id 'Microsoft.DocumentDB/databaseAccounts' "$cosmos_name")"
          az resource delete --ids "$(resource_id 'Microsoft.Storage/storageAccounts' "$storage_name")"
          echo "Flyingfish resources have been deleted. The resource group and deployment history were retained."
